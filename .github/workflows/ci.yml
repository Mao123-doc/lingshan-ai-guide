name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm --prefix backend ci
      - name: Build
        run: npm --prefix backend run build
      - name: Contract, reliability and security tests
        run: npm --prefix backend test

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Unit tests
        run: npm --prefix frontend run test:unit
      - name: Lint
        run: npm --prefix frontend run lint
        continue-on-error: true
      - name: Build
        run: npm --prefix frontend run build

  python-quality:
    name: Python Evaluation Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Evaluator and quality gate tests
        run: python -m pytest backend/python/tools -q

  browser:
    name: Browser Journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run desktop and mobile journeys
        run: npm --prefix frontend run test:e2e -- --project=chromium --project=mobile-chromium
